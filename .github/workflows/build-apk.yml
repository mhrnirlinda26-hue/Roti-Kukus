name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roti-kukus-app

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: roti-kukus-app/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js static export
        run: npm run build

      - name: Init Capacitor Android (jika belum ada)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK (debug + release unsigned)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/RotiKukusThailand-v1.0-debug.apk
          ls -lh android/app/build/outputs/apk/debug/

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: RotiKukusThailand-APK
          path: roti-kukus-app/android/app/build/outputs/apk/debug/RotiKukusThailand-v1.0-debug.apk
          retention-days: 90
