name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roti-kukus-app

    steps:
      - name: Checkout kode
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: roti-kukus-app/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Runner ubuntu-latest sudah menyediakan Android SDK di /usr/local/lib/android/sdk
      # (foldernya read-only, jadi jangan chmod). Cukup accept license via sdkmanager.
      - name: Setup Android SDK (accept license)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "sdkmanager: $SDKMANAGER"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager tidak executable"; exit 1; }

          # Accept semua license (prompt yes sudah otomatis via yes)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          echo "--- paket terinstall ---"
          "$SDKMANAGER" --list_installed 2>/dev/null | head -30 || true

      - name: Tulis local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          cat android/local.properties

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js static export
        run: npm run build

      - name: Init Capacitor Android (jika belum ada)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/debug
          cp app-debug.apk RotiKukusThailand-v1.0-debug.apk
          ls -lh

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: RotiKukusThailand-APK
          path: roti-kukus-app/android/app/build/outputs/apk/debug/RotiKukusThailand-v1.0-debug.apk
          retention-days: 90
