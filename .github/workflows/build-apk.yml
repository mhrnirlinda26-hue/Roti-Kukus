name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roti-kukus-app

    steps:
      - name: Checkout kode
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: roti-kukus-app/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Runner ubuntu-latest sudah menyediakan Android SDK di $ANDROID_SDK_ROOT.
      # Kita hanya perlu accept license + install platform/build-tools yang dibutuhkan.
      - name: Setup Android SDK (manual, tanpa action Node20)
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -e
          echo "SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT" || echo "SDK tidak ada di path default"

          SDKMANAGER=$(find /usr/local/lib/android/sdk /usr/lib/android-sdk "$HOME/Android/Sdk" \
            -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMANAGER"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan"
            exit 1
          fi

          chmod +x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -20
          "$SDKMANAGER" --list_installed 2>&1 | head -20

      - name: Tulis local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > roti-kukus-app/android/local.properties
          cat roti-kukus-app/android/local.properties

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js static export
        run: npm run build

      - name: Init Capacitor Android (jika belum ada)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/debug
          cp app-debug.apk RotiKukusThailand-v1.0-debug.apk
          ls -lh

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: RotiKukusThailand-APK
          path: roti-kukus-app/android/app/build/outputs/apk/debug/RotiKukusThailand-v1.0-debug.apk
          retention-days: 90
