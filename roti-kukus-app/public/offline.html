<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#7e22ce" />
<title>Offline — Roti Kukus Thailand</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f3ff; color: #1e1b4b; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: rgba(255,255,255,.9); border: 1px solid #e9d5ff; border-radius: 20px; padding: 28px 22px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(126,34,206,.12); }
  .icon { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg,#9333ea,#4f46e5); color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
  h1 { font-size: 17px; margin-bottom: 6px; }
  p { font-size: 13px; color: #6b7280; line-height: 1.6; margin-bottom: 16px; }
  a { display: inline-block; background: #7e22ce; color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; padding: 11px 22px; border-radius: 12px; }
  small { display: block; margin-top: 12px; font-size: 11px; color: #a78bfa; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">◍</div>
    <h1>Anda sedang offline</h1>
    <p>Tenang, data penjualan Ibu Ai tersimpan aman di HP ini. Sambungkan internet lalu buka kembali aplikasi untuk memuat halaman terbaru.</p>

  </div>
</body>
</html>
